# On-demand development-client builds. This project uses expo-dev-client
# custom development builds — Expo Go is not a supported runtime (the app's
# native modules cannot run in it). Dispatch this workflow from the EAS
# dashboard (or `eas workflow:run dev-client.yml`) to get debuggable dev
# clients for physical devices; the client loads JS from a local dev server
# (`npm run dev`), so it only needs rebuilding when native dependencies or
# native config change — not per PR. Per-PR testable artifacts come from
# pr-preview.yml instead.
#
# Operator prerequisites: same credential setup as pr-preview.yml (iOS ad
# hoc distribution with registered devices via `eas device:create`, Android
# keystore) — see that file's header comment.

name: Development Client Builds

on:
  workflow_dispatch: {}

jobs:
  build_android:
    name: Build Android Dev Client
    type: build
    params:
      platform: android
      profile: development

  build_ios:
    name: Build iOS Dev Client
    type: build
    params:
      platform: ios
      profile: development
      refresh_ad_hoc_provisioning_profile: true
