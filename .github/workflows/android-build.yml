name: Android Preview Build

# Manually-dispatched Android preview build. Run this when a PR looks ready for
# merge to produce a signed, installable APK distributed via Firebase App
# Distribution, so a human can verify the change on a physical device. It is
# deliberately NOT a merge blocker and does NOT run on pull_request events —
# dispatch it from the Actions tab, `gh workflow run android-build.yml --ref
# <branch>`, or an agent, choosing the PR's branch as the ref.
#
# The build is split into a cached `prebuild` job (`expo prebuild`, keyed by a
# checksum of app.json + package-lock.json) and a `build_android` job, so an
# unchanged app config + lockfile reuses the generated native project across
# runs. `actions/cache` handles cross-run reuse; the artifact handles the
# cross-job handoff within a run (caches are only eventually-consistent).
#
# Operator prerequisites — the build fails cleanly until these repo secrets
# exist (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64        base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD      keystore password
#   ANDROID_KEY_ALIAS              signing key alias
#   ANDROID_KEY_PASSWORD           signing key password
#   FIREBASE_ANDROID_APP_ID        Firebase Android app id (1:...:android:...)
#   FIREBASE_SERVICE_ACCOUNT_JSON  service-account JSON for App Distribution
#   SENTRY_AUTH_TOKEN              source-map upload during the release build
# Optional:
#   FIREBASE_GROUPS (repo variable)  comma-separated Firebase tester groups

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to comment the install link on (optional)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

# One build per ref at a time; a fresh dispatch supersedes an in-flight one.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prebuild:
    name: Prebuild (cached)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Restore prebuilt android project
        id: cache
        uses: actions/cache@v4
        with:
          path: android
          key: android-prebuild-${{ hashFiles('app.json', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Expo prebuild (android)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install
      - name: Upload android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android
          include-hidden-files: true
          retention-days: 1

  build_android:
    name: Build Android
    needs: [prebuild]
    runs-on: ubuntu-latest
    outputs:
      testing_uri: ${{ steps.fastlane.outputs.testing_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # node_modules is needed at build time too: Gradle's release-bundle task
      # runs Metro to bundle the JS, independent of the restored native project.
      - name: Install dependencies
        run: npm ci
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Download android project
        uses: actions/download-artifact@v4
        with:
          name: android-project
          path: android
      - name: Restore gradlew permissions
        run: chmod +x android/gradlew
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Build and distribute
        id: fastlane
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bundle exec fastlane android preview

  report:
    name: Report install link
    needs: [build_android]
    runs-on: ubuntu-latest
    steps:
      - name: Write run summary
        env:
          TESTING_URI: ${{ needs.build_android.outputs.testing_uri }}
        run: |
          if [ -n "$TESTING_URI" ]; then
            echo "### Android preview build ready" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Install on a device]($TESTING_URI)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android preview build finished without an install link" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the build logs — the Firebase upload may not have returned a testing URI." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment install link on PR
        if: ${{ github.event.inputs.pr != '' && needs.build_android.outputs.testing_uri != '' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr }}
          TESTING_URI: ${{ needs.build_android.outputs.testing_uri }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `📱 Android preview build ready — [install on a device](${process.env.TESTING_URI})`,
            });
