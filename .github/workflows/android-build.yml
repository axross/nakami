name: Android Preview Build

# Manually-dispatched Android preview build. Run this when a PR looks ready for
# merge to produce a signed, installable APK distributed via Firebase App
# Distribution, so a human can verify the change on a physical device. It is
# deliberately NOT a merge blocker and does NOT run on pull_request events —
# dispatch it from the Actions tab, `gh workflow run android-build.yml --ref
# <branch>`, or an agent, choosing the PR's branch as the ref.
#
# The workflow is split into four jobs so a failed phase can be re-run on its
# own via "Re-run failed jobs" (GitHub keeps the successful jobs' artifacts, so
# a re-run reuses them instead of redoing that work):
#   prebuild  cached `expo prebuild`, keyed by a checksum of app.json +
#             package-lock.json, so an unchanged app config + lockfile reuses
#             the generated native project across runs.
#   build     assembles + signs the release APK and uploads it as an artifact.
#   publish   downloads that APK and distributes it via Firebase App
#             Distribution. A failed distribution re-runs HERE without
#             rebuilding the APK.
#   report    writes the run summary and (optionally) comments the install link.
# `actions/cache` handles cross-run reuse of the native project; artifacts hand
# the native project (prebuild -> build) and the APK (build -> publish) between
# jobs within a run. Each job carries only the credentials its phase needs — the
# keystore never reaches `publish`, the Firebase account never reaches `build`.
#
# Operator prerequisites — the build fails cleanly until these repo secrets
# exist (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64        base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD      keystore password
#   ANDROID_KEY_ALIAS              signing key alias
#   ANDROID_KEY_PASSWORD           signing key password
#   FIREBASE_SERVICE_ACCOUNT_JSON  service-account JSON for App Distribution
#   SENTRY_AUTH_TOKEN              source-map upload during the release build
# Repo variables (same screen, Variables tab) — not secrets:
#   FIREBASE_ANDROID_APP_ID        Firebase Android app id (1:...:android:...).
#                                  Kept as a variable, not a secret, so the
#                                  tester install link (which embeds the app id)
#                                  is not masked out of the run summary / PR
#                                  comment by Actions' secret redaction.
#   FIREBASE_GROUPS (optional)     comma-separated Firebase tester groups

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to comment the install link on (optional)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

# One build per ref at a time; a fresh dispatch supersedes an in-flight one.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# Tester(s) invited to every preview build so they can install without waiting
# on a manual Firebase invitation. A workflow constant (not a repo variable) so
# it is always set; passed into the publish lane's firebase_app_distribution
# `testers`. Comma-separate to invite more than one.
env:
  FIREBASE_TESTERS: yo@axross.dev

jobs:
  prebuild:
    name: Prebuild (cached)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore prebuilt android project
        id: cache
        uses: actions/cache@v4
        with:
          path: android
          key: android-prebuild-${{ hashFiles('app.json', 'package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Expo prebuild (android)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install
      - name: Upload android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project
          path: android
          include-hidden-files: true
          retention-days: 1

  build:
    name: Build Android
    needs: [prebuild]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # node_modules is needed at build time too: Gradle's release-bundle task
      # runs Metro to bundle the JS, independent of the restored native project.
      - name: Install dependencies
        run: npm ci
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Download android project
        uses: actions/download-artifact@v4
        with:
          name: android-project
          path: android
      - name: Restore gradlew permissions
        run: chmod +x android/gradlew
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      # Per-build versionName so a tester can identify which PR/commit an
      # installed preview APK came from: "<semver>-pr-<n>" when dispatched for a
      # PR, else "<semver>-<short-sha>". `semver` is the app's own version from
      # app.json; the `pr` dispatch input is read as an env var (never
      # interpolated into the script) so a crafted value cannot inject shell.
      - name: Compute preview version name
        id: version
        env:
          PR: ${{ github.event.inputs.pr }}
        run: |
          semver="$(node -p "require('./app.json').expo.version")"
          if [ -n "$PR" ]; then
            suffix="pr-$PR"
          else
            suffix="${GITHUB_SHA:0:7}"
          fi
          echo "name=${semver}-${suffix}" >> "$GITHUB_OUTPUT"
      - name: Build signed APK
        id: fastlane
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bundle exec fastlane android build
      # Stage the Gradle output APK under a stable name so the publish job can
      # reference a deterministic download path instead of guessing the filename.
      - name: Stage APK for upload
        run: cp "${{ steps.fastlane.outputs.apk_path }}" "$RUNNER_TEMP/preview.apk"
      # Confirm AGP's injected versionName actually landed in the assembled APK,
      # rather than trusting that the `android.injected.version.name` property
      # took effect. Reads the compiled manifest back with aapt2 and fails the
      # build on a mismatch, so a silently-ignored override surfaces loudly here
      # instead of shipping a mislabeled preview. Skips (warns only) if aapt2 is
      # absent, so missing tooling never masquerades as a version mismatch.
      - name: Verify injected versionName
        env:
          EXPECTED: ${{ steps.version.outputs.name }}
        run: |
          aapt2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$aapt2" ]; then
            echo "::warning::aapt2 not found under \$ANDROID_HOME/build-tools; skipping versionName readback."
            exit 0
          fi
          actual="$("$aapt2" dump badging "$RUNNER_TEMP/preview.apk" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          {
            echo "### Preview APK versionName"
            echo ""
            echo "- expected: \`$EXPECTED\`"
            echo "- actual: \`$actual\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Expected versionName: $EXPECTED"
          echo "Actual   versionName: $actual"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::Assembled APK versionName '$actual' does not match the injected '$EXPECTED' — the AGP versionName override did not take effect."
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/preview.apk
          retention-days: 1

  publish:
    name: Publish to Firebase
    needs: [build]
    runs-on: ubuntu-latest
    outputs:
      testing_uri: ${{ steps.fastlane.outputs.testing_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: apk
      - name: Distribute to Firebase
        id: fastlane
        env:
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_PATH: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_GROUPS: ${{ vars.FIREBASE_GROUPS }}
          ANDROID_APK_PATH: apk/preview.apk
        run: bundle exec fastlane android publish

  report:
    name: Report install link
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Write run summary
        env:
          TESTING_URI: ${{ needs.publish.outputs.testing_uri }}
        run: |
          if [ -n "$TESTING_URI" ]; then
            echo "### Android preview build ready" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Install on a device]($TESTING_URI)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Android preview build finished without an install link" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Check the build logs — the Firebase upload may not have returned a testing URI." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Comment install link on PR
        if: ${{ github.event.inputs.pr != '' && needs.publish.outputs.testing_uri != '' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.inputs.pr }}
          TESTING_URI: ${{ needs.publish.outputs.testing_uri }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `📱 Android preview build ready — [install on a device](${process.env.TESTING_URI})`,
            });
