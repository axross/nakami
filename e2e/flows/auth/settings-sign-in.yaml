appId: app.axross.payload
name: auth-settings-sign-in — signed-out Settings offers a Sign in row that opens the sign-in screen
tags:
  - scenario:auth-settings-sign-in
---
- launchApp:
    clearState: true
- tapOn: "Settings"
- assertVisible:
    id: "settings-screen"
- assertVisible:
    id: "settings-sign-in-button"
- tapOn:
    id: "settings-sign-in-button"
- assertVisible:
    id: "sign-in-screen"
