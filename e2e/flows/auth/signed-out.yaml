appId: app.axross.nakami
name: auth-signed-out — signed out shows the welcome screen with no tab bar
tags:
  - scenario:auth-signed-out
---
- launchApp:
    clearState: true
- assertVisible:
    id: "welcome-screen"
- assertVisible:
    id: "welcome-sign-in-button"
# The tab UI mounts only after authentication, so no tab bar is shown here.
- assertNotVisible: "Collections"
- assertNotVisible: "Settings"
