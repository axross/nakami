appId: app.axross.nakami
name: settings-menu — settings groups render and License pushes the Licenses screen
tags:
  - scenario:settings-menu
---
- launchApp:
    clearState: true
- tapOn: "Settings"
- assertVisible:
    id: "settings-screen"
- assertVisible:
    id: "settings-feedback-row"
- assertVisible:
    id: "settings-license-row"
# The Debug group (Open Dev Menu) renders only in development-mode builds
# (__DEV__), so it is not asserted here — this flow runs against both dev-mode
# and release-mode builds.
- assertVisible:
    id: "settings-technical-details"
- tapOn:
    id: "settings-license-row"
- assertVisible:
    id: "licenses-screen"
