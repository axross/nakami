appId: app.axross.payload
name: tab-navigation — switching tabs reaches the signed-out tab screens
tags:
  - scenario:tab-navigation
---
- launchApp:
    clearState: true
- assertVisible:
    id: "home-screen"
- tapOn: "Settings"
- assertVisible:
    id: "settings-screen"
- tapOn: "Home"
- assertVisible:
    id: "home-screen"
